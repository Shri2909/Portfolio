<style>
/* Ek Diya Se Doosra: styles. A night Deepavali page. System fonts only, no downloads. Tokens first. */
:root {
  color-scheme: dark;
  --ground-0: #0A0B14; --ground-1: #0F1020; --ground-2: #1A1426; --ground-3: #2A1B2A; --ground-4: #3A2226; --ground-5: #46291A; --ground-6: #583520;

  --cream: #FFF3DC; --cream-dim: #D9C8AA; --kumkum: #C2410C; --marigold: #F5A623; --leaf: #2F6B4F; --ink: #16110C;
  --panel: rgba(26, 20, 38, .86); --edge: rgba(245, 166, 35, .32);

  --font-body: system-ui, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22, .61, .36, 1);

}

html[data-tone="2"] { --sky-a: #080A18; --sky-b: #141229; --sky-c: #2E1830; --stars: .95; --veil: .48; }
html[data-tone="3"] { --sky-a: #120D1F; --sky-b: #2B1A33; --sky-c: #5A2A2C; --stars: .8; --veil: .4; }
html.dusk { --sky-a: #1C1226; --sky-b: #5A2D3A; --sky-c: #D98A3D; --stars: .4; --veil: .26; }
html.visitor-lit { --sky-a: #22152B; --sky-b: #6B3440; --sky-c: #F2A94E; --stars: .3; --veil: .22; }

*, *::before, *::after { box-sizing: border-box; }
html { overflow-x: clip; background: var(--ground-0); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }

:focus-visible { outline: 3px solid var(--flame-core); outline-offset: 2px; }
.skip-link { position: absolute; left: 8px; top: -60px; z-index: 60; padding: 12px 16px; min-height: 44px; background: var(--cream); color: var(--ink); border-radius: 8px; font-weight: 600; text-decoration: none; }
.skip-link:focus { top: 8px; }

/* ---------- the night: sky layers cross-fade by tone ---------- */
.sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(180deg, var(--sky-a) 0%, var(--sky-b) 55%, var(--sky-c) 100%); transition: background 1.6s var(--ease); }
.sky::before { content: ""; position: absolute; inset: 0; opacity: var(--stars); transition: opacity 1.6s var(--ease);
  background-image: radial-gradient(1.2px 1.2px at 22px 34px, #fff 50%, transparent 52%), radial-gradient(1px 1px at 96px 120px, #FFF3DC 50%, transparent 52%), radial-gradient(1.4px 1.4px at 170px 60px, #fff 50%, transparent 52%), radial-gradient(1px 1px at 230px 180px, #FFE9B8 50%, transparent 52%), radial-gradient(1px 1px at 60px 210px, #fff 50%, transparent 52%), radial-gradient(1.2px 1.2px at 150px 250px, #FFF3DC 50%, transparent 52%);
  background-size: 260px 280px; }
.sky::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 95% at 50% 35%, transparent 40%, rgba(0, 0, 0, var(--veil)) 100%); }
.page { position: relative; z-index: 2; min-height: 100svh; display: flex; flex-direction: column; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 30; height: var(--topbar-h); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 12px; background: rgba(10, 11, 20, .94); border-bottom: 1px solid var(--edge); }
.brand { font-family: var(--font-display); font-weight: 700; letter-spacing: .14em; font-size: 14px; color: var(--flame-core); white-space: nowrap; }

.nav-link:hover { background: rgba(245, 166, 35, .18); }

/* ---------- panels ---------- */
.panels { flex: 1; padding: 6px 0 28px; outline: none; }

.mini { font-family: var(--font-display); font-size: 1.1rem; margin: 14px 0 6px; color: var(--flame-core); } .mini.big { font-size: 1.4rem; color: var(--cream); }
.cta-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; } .cta-row.center { justify-content: center; }
.btn { min-height: 44px; min-width: 44px; padding: 8px 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255, 243, 220, .07); color: var(--cream); border: 1.5px solid var(--marigold); border-radius: 12px; font-size: 15px; font-weight: 600; line-height: 1.2; cursor: pointer; text-align: center; text-decoration: none; transition: background .25s var(--ease), transform .12s; }
.btn:hover { background: rgba(245, 166, 35, .2); } .btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(var(--flame-core), var(--marigold)); color: var(--ink); border-color: var(--flame-core); } .btn.primary:hover { background: linear-gradient(#FFE29B, #F7B53F); }

.seg { display: inline-flex; } .seg .btn { border-radius: 0; } .seg .btn:first-child { border-radius: 12px 0 0 12px; } .seg .btn:last-child { border-radius: 0 12px 12px 0; margin-left: -1.5px; }

/* ---------- the opening ---------- */

.row { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px 4px; align-items: end; }

.lamp-btn, .home-lamp { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 88px; min-height: 96px; padding: 6px 4px; background: none; border: 1.5px solid transparent; border-radius: 14px; cursor: pointer; color: var(--cream); }
.home-lamp { cursor: default; }
.lamp-btn:hover { background: rgba(245, 166, 35, .1); }
.lamp-btn.next { border-color: rgba(245, 166, 35, .55); }

.chip-name { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; color: var(--cream); }

.below { font-family: var(--font-display); font-size: 1.15rem; margin: 18px 0 8px; }
.intro-p { max-width: 62ch; color: var(--cream-dim); }

/* ---------- the clay diya (inline SVG) ---------- */
.diya { width: 78px; height: auto; overflow: visible; }
.diya .clay { fill: var(--kumkum); } .diya .rim { fill: #E0642B; } .diya .oil { fill: #3a1a0a; } .diya .wick { fill: #2a1a10; }
.diya .glow { fill: url(#none); fill: rgba(255, 179, 71, .5); opacity: 0; transition: opacity .8s var(--ease); filter: blur(10px); }
.diya .flame { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; transition: opacity .6s var(--ease); }
.diya .fl-out { fill: var(--flame-b); } .diya .fl-in { fill: var(--flame-core); }
.diya.dashed .clay, .diya.dashed .rim { fill: none; stroke: var(--cream-dim); stroke-width: 2; stroke-dasharray: 5 4; } .diya.dashed .oil { fill: none; }
.home-lamp .flame, .lamp-btn.lit .flame, .story.lit .flame, .visitor-lit .visitor .flame { opacity: 1; animation: flicker 2.6s ease-in-out infinite; }
.home-lamp .glow, .lamp-btn.lit .glow, .story.lit .glow, .visitor-lit .visitor .glow { opacity: 1; }
@keyframes flicker { 0%, 100% { transform: scale(1, 1) rotate(0); } 25% { transform: scale(.95, 1.06) rotate(-2deg); } 55% { transform: scale(1.04, .96) rotate(1.5deg); } 80% { transform: scale(.97, 1.04) rotate(-1deg); } }

/* ---------- lamp stories ---------- */
.intro-panel { padding: 16px 18px 12px; } .intro-panel .panel-title { margin-bottom: 2px; }
.story-head { display: flex; align-items: center; gap: 8px; } .story-head .story-flame .diya { width: 56px; }
.story-head .kicker { margin: 0; }
.story.lit { border-color: var(--marigold); box-shadow: 0 0 0 1px rgba(245, 166, 35, .3), 0 0 40px -6px rgba(255, 179, 71, .35); }
.l1-sum { line-height: 1.6; margin: 0 0 12px; max-width: 62ch; }
.l1-cap { border-left: 4px solid var(--marigold); padding: 2px 0 2px 12px; margin-bottom: 16px; } .l1-capt { margin: 0; line-height: 1.5; }
details.level, details.folder { background: rgba(255, 243, 220, .05); border: 1px solid var(--edge); border-left: 4px solid var(--marigold); border-radius: 10px; margin: 0 0 12px; scroll-margin-top: calc(var(--topbar-h) + 14px); }
details.level > summary, details.folder > summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; padding: 8px 12px; cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details.level > summary svg, details.folder > summary svg { flex: 0 0 auto; width: 22px; height: 22px; color: var(--marigold); transition: transform .25s var(--ease); }
details[open] > summary svg { transform: rotate(180deg); }
.lv-t, .sum-t { display: flex; flex-direction: column; } .lv-l { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; } .lv-h { font-size: 14px; color: var(--cream-dim); }
.lv-body { padding: 4px 14px 12px; }
.reveals { margin: 18px 0 8px; } .reveals h3 { font-family: var(--font-display); font-size: 1.1rem; color: var(--flame-core); margin: 0 0 8px; }
.reveals ul { padding-left: 20px; } .reveals li { line-height: 1.55; margin: 0 0 8px; max-width: 62ch; }
.story-end p { color: var(--cream); }
.variants { padding-left: 20px; margin: 0 0 12px; } .variants li { margin: 0 0 6px; }
.warn { margin: 14px 0; padding: 10px 14px; border-radius: 10px; border: 1px dashed var(--cream-dim); }
.try { color: var(--flame-core); margin-top: 10px; min-height: 1.5em; }
.signoff { font-family: var(--font-display); font-size: 1.3rem; margin-top: 18px; color: var(--flame-core); }
.deeper { margin-top: 6px; }

/* ---------- widgets ---------- */
.widget { margin: 20px 0 8px; padding: 14px; background: rgba(10, 11, 20, .55); border: 1px solid var(--edge); border-top: 3px solid var(--marigold); border-radius: 12px; }
.widget .label-gold { margin-bottom: 8px; }
.w-hint { color: var(--cream-dim); font-style: italic; margin: 0 0 6px; font-size: 15px; }
.plainly { margin-top: 12px; font-size: 14.5px; line-height: 1.5; color: var(--cream-dim); } .plainly strong { color: var(--cream); }
.w-state { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; color: var(--flame-core); margin: 2px 0 10px; }
.w-ask { font-weight: 600; margin: 14px 0 4px; }
.wall { display: grid; grid-template-columns: repeat(18, 1fr); gap: 3px; max-width: 360px; }
.wall i { display: block; aspect-ratio: 1; background: var(--flame-a); border-radius: 50%; opacity: .85; box-shadow: 0 0 4px rgba(255, 179, 71, .6); }
.finds { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; max-width: 360px; }
.finds i { width: 15px; height: 15px; border-radius: 50%; background: var(--cream); } .finds i.hi { background: var(--kumkum); box-shadow: 0 0 0 2px var(--cream); }

.opt { min-height: 56px; padding: 6px; cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; background: rgba(255, 243, 220, .07); border: 1.5px solid var(--marigold); border-radius: 12px; transition: background .25s; }
.opt:hover { background: rgba(245, 166, 35, .2); } .opt[aria-pressed="true"] { background: rgba(245, 166, 35, .35); }
.revealed .opt.actual { box-shadow: 0 0 0 3px var(--flame-core); }
.reveal { margin-top: 12px; line-height: 1.5; } .reveal:empty { display: none; }
.model-badge { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.4; color: var(--cream-dim); margin: 0 0 10px; } .model-badge strong { color: var(--marigold); letter-spacing: .06em; }
.late-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-bottom: 4px; } .late-ctl .lbl { margin: 0; }
.tl-svg { display: block; width: 100%; max-width: 560px; height: auto; }
.tl-svg .ax { stroke: var(--cream-dim); stroke-width: 2; } .tl-svg .dl { stroke: var(--flame-b); stroke-width: 3; } .tl-svg .late-zone { fill: rgba(194, 65, 12, .22); }
.tl-svg .mk { fill: var(--flame-core); stroke: var(--flame-b); stroke-width: 3; } .tl-svg[data-late="true"] .mk { fill: var(--cream-dim); stroke: var(--cream-dim); }
.tl-svg .tx { font: 12px var(--font-mono); fill: var(--cream-dim); } .tl-svg .dtx { fill: var(--flame-core); font-weight: 700; }
.arrival { margin: 8px 0 4px; }

.verdict[data-state="bad"] { border-left-color: var(--kumkum); } .verdict[data-state="good"] { border-left-color: var(--flame-core); }
.vbadge { display: inline-block; font-family: var(--font-mono); font-weight: 700; font-size: 12px; letter-spacing: .08em; padding: 1px 8px; border: 2px solid currentColor; border-radius: 4px; margin-right: 4px; color: var(--cream-dim); }
.verdict[data-state="bad"] .vbadge { color: #FF9A6B; } .verdict[data-state="good"] .vbadge { color: var(--flame-core); }
.string { --f: 0; --fill: calc(22px + (100% - 44px) * var(--f)); -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 44px; margin: 4px 0; padding: 0; background: transparent; cursor: grab; touch-action: pan-y; }
.string::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--flame-a) var(--fill), rgba(255, 179, 71, .28) var(--fill)); }
.string::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(255, 179, 71, .28); } .string::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--flame-a); }
.string::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 44px; height: 44px; margin-top: -20px; border: 0; border-radius: 50%; background: radial-gradient(circle at 50% 62%, var(--flame-core) 0 5px, var(--flame-b) 6px 11px, rgba(255, 122, 26, .25) 12px, transparent 20px); }
.string::-moz-range-thumb { width: 44px; height: 44px; border: 0; border-radius: 50%; background: radial-gradient(circle at 50% 62%, var(--flame-core) 0 5px, var(--flame-b) 6px 11px, rgba(255, 122, 26, .25) 12px, transparent 20px); }

l uthe.","body":"Dekhiye: ek diya doosre se jala, aur pehle wale ki roshni kam nahi hui.","dusk":"Kamra ab thoda sunehra ho gaya."},"person":{"step":"01 · Meet the person","sub":"Who I am, what drives me, what makes me different","kicker":"THE PERSON BEHIND THE FILE","heading":"Is file ke peeche ka insaan","body":["My father's accident brought serious financial pressure during my Class 12 exams. A gap year, unsuccessful entrance attempts, YouTube study and a ₹3,999 course formed my route to VIT Pune.","I coordinated four research contributors, placed second in a college debate, and enjoy business case studies, essays and Advaita Vedanta. I care about people as much as code.","**I didn't learn that every plan works. I learned to decide what to do when it doesn't.**"]},"lamps":{"step":"02 · Three lamps, three decisions","sub":"CERTGEN → BLITZ → VIGIL"},"lamp1":{"heading":"LAMP 01 — CERTGEN","title":"The Green Wall · Sab Green Tha. Par Kya Sab Theek Tha?","tagline":"324 Tests Passed. I Still Wasn't Convinced.","body":["A hiring assignment asked me to build a bulk certificate generator. Simple enough to make it work. But I wanted to build something that could survive when things went wrong.","Mera sawaal simple tha: agar hazaar students ke certificates ban rahe hain, toh ek galat entry ki wajah se baaki sab kyun rukenge?","So I mapped the entire workflow, designed the architecture, and chose background processing with fault isolation. AI agents helped with much of the implementation, while I directed the design and key product decisions.","Then came the interesting part.","324 tests passed. Everything was green.","Ab normally kya hota? Project complete. Screenshot lo. Aage badho.","But I wasn't convinced.","A separate audit uncovered 19 problems. I directed further remediation, made decisions about safeguards, resource limits, and authentication, and pushed for more corrections when the first fixes weren't sufficient.","I even dropped a QR-verification feature when it violated an existing requirement.","Feature impressive tha. Lekin requirement tod raha tha. Toh feature gaya, requirement nahi.","The remediation report eventually recorded zero open findings within its scope. Later local checks passed 479 main-suite and 232 audit-suite tests.","**What I learned:** Ownership doesn't mean defending everything you've built. It means having the courage to question it.","Apna banaya hua system khud challenge karna bhi ownership hai."],"revealsLabel":"Three things this reveals about me","reveals":["Systems Thinking: I design complete workflows around real-world constraints, not just happy-path demonstrations.","Product Judgment: I make difficult trade-offs and prioritize requirements over attractive extras.","Extreme Ownership: When initial fixes aren't enough, I continue directing improvements instead of declaring premature success."],"growth":"**My growth connection:** A dashboard full of green numbers doesn't automatically mean users are happy.\nNumbers achhe dikh rahe hain, par kya user ko sach mein value mil rahi hai? That's the question I want to ask.","note":"**Evidence note:** AI agents performed much of the coding, audits, and fixes. The results describe a tested prototype, not a production security guarantee.","guess":{"label":"GUESS THE AUDIT RESULT → REVEAL 19","options":[0,3,8,19],"answer":19,"high":2,"reveal":"The audit found 19 problems, two of them high. One crafted value caused disproportionate CPU work. A request of roughly 26 MB expanded into roughly 192 MB of response material. The tests hadn't asked those questions, and I directed more remediation.","plain":"324 of 324 tests passed. A separate audit then found 19 problems, two of them high.","status":"324 / 324 tests pass","lowAfter":"Kam socha? Aap akele nahi hain. 324 tests ne bhi wahi socha.","rightAfter":"Bilkul sahi. Tests ko yeh nahi dikha tha."},"level1":{"summary":"A hiring assignment asked me to build a bulk certificate generator. 324 tests passed. A separate audit uncovered 19 problems.","capability":"Extreme Ownership: When initial fixes aren't enough, I continue directing improvements instead of declaring premature success."},"level3":{"folder":"c1","label":"CHECK THE RECEIPT"},"n":1,"name":"Certgen","litMsg":"Lamp 1 jal utha. Ab iska kissa."},"lamp2":{"heading":"LAMP 02 — BLITZ","title":"The Number I Withdrew · Number Bada Tha. Par Sach?","tagline":"I Chose to Withdraw My Most Impressive Number.","body":["I wanted to build a high-performance stock-order matching engine. The challenge wasn't just making it fast. It was proving that the improvements were real.","Fast bolna aasaan hai. Lekin kitna fast? Aur uska proof kya hai?","I designed the workflow and architecture, and established an approach for comparing optimizations with simpler alternatives. AI agents handled much of the coding and benchmarking. I directed the evaluation and decisions about which claims were defensible.","Then came a number I could have proudly displayed.","1,205 nanoseconds.","Dekhne mein impressive tha. Resume par bhi achha lagta.","But an audit revealed that this headline came from an uncommitted version of the code. A more controlled historical run gave 1,850 nanoseconds.","And another claimed 3.1× advantage? It shrank to approximately 1.02×.","Ab do options the: impressive number bachao, ya sach accept karo.","I chose to withdraw or downgrade claims the evidence couldn't support. Later changes also made the replacement latency outdated.","**What I learned:** A smaller truth is worth more than a bigger claim you cannot defend.","Har achha dikhne wala number achha result nahi hota."],"revealsLabel":"Three things this reveals about me","reveals":["Analytical Thinking: I approach improvements as hypotheses requiring fair comparisons.","Independent Judgment: I'm willing to change a conclusion when better evidence contradicts it.","Evidence-Driven Problem-Solving: I question measurement methods and investigate unexpected results before deciding what to change."],"growth":"**My growth connection:** Imagine a campaign reporting thousands of sign-ups.\nSunne mein amazing hai. Lekin kitne log actually product use kar rahe hain? Kitne wapas aaye?\nThat's the difference between celebrating a number and understanding what it means.","note":"**Evidence note:** AI agents performed much of the implementation, benchmarking, and investigation. The 1,850 ns result is historical; current latency has not been remeasured.","level1":{"summary":"I wanted to build a high-performance stock-order matching engine. 1,205 nanoseconds. A more controlled historical run gave 1,850 nanoseconds.","capability":"Evidence-Driven Problem-Solving: I question measurement methods and investigate unexpected results before deciding what to change."},"level3":{"folder":"c3","label":"CHECK THE RECEIPT"},"n":2,"name":"Blitz","litMsg":"Lamp 2 jal utha. Ek diya jala. Ab agla."},"lamp3":{"heading":"LAMP 03 — VIGIL","title":"The Late Witness · System Bola Healthy. Maine Poochha, Pakka?","tagline":"The System Said Everything Was Fine. I Questioned Whether It Was.","body":["Imagine a trading system receiving live market prices. Suddenly, a connection stops responding—but the system still believes everything is fine.","Screen par sab normal dikh raha hai. Lekin data hi purana hai. Ab bharosa kis par karein?","That's the problem I wanted Vigil to address.","I defined the requirements, designed the monitoring and reconnection workflows, and made key decisions about failure handling. AI agents helped implement and investigate the system.","Then I asked a question that changed the direction of the testing:","Were our tests actually proving what the system promised?","Tests pass ho rahe the. Lekin kya woh sahi sawaal pooch rahe the?","An AI-assisted investigation exposed a serious flaw: a reply arriving after its deadline could still make a failed connection appear healthy.","Matlab jawab late aaya, aur system ne maan liya—sab theek hai!","I directed corrective work, approved changes to the connection rules, and sought evidence that the correction would detect the original problem.","When the fix was deliberately removed, two targeted tests failed. Restored, all 105 local tests passed.","I also challenged performance measurements that weren't measuring what they claimed.","**What I learned:** Before celebrating a successful result, make sure you're testing the right definition of success.","Galat sawaal ka correct answer bhi kaam ka nahi."],"revealsLabel":"Three things this reveals about me","reveals":["Systems Thinking: I translate complex problems into defined behaviors, workflows, and failure-handling decisions.","Critical Thinking: I question whether passing tests actually prove what matters.","Evidence-Driven Ownership: I direct corrective action and seek tests that can expose the original failure again."],"growth":"**My growth connection:** A new Wispr Flow installation might look like success.\nLekin agar user agle din Flow use hi na kare, toh kya woh real adoption hai?\nI want to understand what happens after the first interaction—not just count how many people started.","note":"**Evidence note:** AI agents carried out much of the technical investigation and implementation. Verification was local and simulation-based, not a production deployment. Some individual decision attributions remain subject to verification...","late":{"label":"TEST THE LATE REPLY","deadline":3,"max":6,"start":2,"plain":"A reply that arrives before the 3-second deadline counts as proof the connection is alive. In the original logic, a reply that arrived after the deadline could still count as proof of health. In the corrected logic it is not counted as proof of current health.","before":"Dono logic mein yahi hota hai.","oldLate":"Yahi dikkat thi."},"level1":{"summary":"Imagine a trading system receiving live market prices. Suddenly, a connection stops responding—but the system still believes everything is fine. That's the problem I wanted Vigil to address.","capability":"Critical Thinking: I question whether passing tests actually prove what matters."},"level3":{"folder":"c2","label":"SEE THE RECEIPT"},"n":3,"name":"Vigil","litMsg":"Lamp 3 jal utha. Lau aage badh rahi hai."},"transition":{"heading":"Three Lamps. One Pattern.","body":["One project taught me not to trust green tests blindly.","Another taught me not to fall in love with impressive numbers.","The third taught me to question whether I was measuring the right thing in the first place.","*Teen alag projects. Teen alag challenges. Lekin ek aadat common thi.*","**I don't want to be right. I want to find out what's right.**","And that is exactly the mindset I want to bring to growth.","Because getting someone to install a product is one thing.","Getting them to genuinely love it, use it again, and make it part of their daily life?","*Woh asli challenge hai.*","**Which brings me to my next question: What happens after someone installs Wispr Flow?**"]},"voice":{"step":"03 · Why Wispr Flow?","sub":"My voice, Flow's text · Soch poori hone do. My genuine voice experience and what it revealed.","kicker":"THE FIRST CLUE WAS MY VOICE","heading":"Soch poori hone do","tagline":"Let people finish thinking.","body":["Here's a real thought I spoke on **2 November 2026**: “Shouldn't the technology adapt to how we naturally think and communicate?”","Dono ko saath rakh ke padhiye: meri hand-transcribed voice memo, aur Flow ka actual text. Thought wahi raha; bas expression saaf ho gaya.","That matters more to me than “type faster”: **let people finish thinking.**"],"compareAfter":3,"compareLabel":"COMPARE THE TWO REAL TAKES","takes":[{"id":"take1","label":"Take 1","recordedAt":"2 Nov 2026, 7:27 pm","raw":"Okay, so... the best interface... I think it's basically when you don't have to think about using it, like learning it sorry sorry how to use it.\n\nLike, when you're using something and you're not constantly wondering where to click or what to do next.\n\nYou're just... doing what you came there to do.\n\nAnd, yeah, I think that's actually quite difficult to build. Because all the complicated stuff, the logic, the decisions... someone has to handle all of that. Just not the user.","output":"Okay the best interface, I think, is basically when you don't have to think about how to use it, like when you are using something and you are not constantly wondering where to click or what to do next. You are just doing what you came there to do. I think that's actually quite difficult to build because all the complicated stuff, the logic, the decisions, someone has to handle all of that, just not the user."},{"id":"take2","label":"Take 2","recordedAt":"2 Nov 2026, 7:30 pm","raw":"Wait, I think there's another way to look at this.\n\nWe spend so much time learning how to use technology... remembering commands, figuring out buttons, changing ourselves to fit the tool adjusting to how a tool works.\n\nBut why? I mean, shouldn't it be the other way around?\n\nShouldn't the technology adapt to how we naturally think and communicate?\n\nBecause we already know what we want to say. We shouldn't have to learn the tool first struggle just to get it out.","output":"I think there's another way to look at this. We spend so much time learning how to use technology: remembering commands, figuring out buttons, adjusting to how a tool works. But why? Shouldn't it be the other way around? Shouldn't the technology adapt to how we naturally think and communicate? Because we already know what we want to say, we shouldn't have to struggle just to get it out."}],"custody":{"source":"My Wispr Flow history","tool":"Wispr Flow","date":"2 Nov 2026","status":"Output matches Flow history word for word","note":"“As I said it” is my own hand transcription of what I said, typed from my voice memo."}},"growth":{"step":"04 · My India growth hypothesis","sub":"The Handover Test — proposed, not run","kicker":"LAMP 04 · PROPOSED, NOT RUN","heading":"The Handover Test — proposed, not run","title":"Yeh diya abhi bujha hai","ideaLabel":"The idea","body":["For India growth, I'd test whether a **Hinglish-first demo for students and early-career users** beats a speed-focused pitch on **first usable dictations** and **a second dictation within a day**. **Proposed, not run.**","Shuruaat ek chhote group se: jo log sach mein Hindi-English mein messages likhte hain. I would not assume every Indian student uses Hinglish."],"variants":["Variant A, speed: “Say the message. Skip typing it.”","Variant B, expression: “Don't stop the thought halfway through. Say it naturally.”"],"warnLabel":"Fair warning","warn":"This test has not been run, and no result is claimed. Koi sample, koi lift, koi number nahi.","cta":{"label":"SEE THE GROWTH TEST","folder":"c8"}},"verdict":{"step":"05 · Continue the conversation","sub":"Interview, résumé, GitHub, LinkedIn","kicker":"YOUR VERDICT","heading":"Seedhi baat","body":["AI helped implement and investigate. I mapped workflows, shaped architecture, made or approved decisions, identified bottlenecks, directed attempts to break the prototypes, and pursued fixes. I didn't personally write every line or discover every bug.","I haven't owned a growth channel or shipped these prototypes to customers. Yeh zimmedari main kamaana chahta hoon.","**I can't promise I'll always be right. I can show you what I do when I'm wrong.**","Koi ek claim chuniye. Uska evidence kholiye. Phir faisle ke baare mein mujhse poochhiye."],"closeHeading":"Ab mujhse ek sawaal poochhiye.","closeBody":["Teen projects mein se koi ek chuniye. Kya hua, maine kya kiya, aur kya abhi adhura hai: teeno batata hoon."],"ctaInterview":"INVITE ME TO AN INTERVIEW","interviewNote":"Ek email. Ek lamp. Baaki baat wahin.","ctaResume":"VIEW MY RÉSUMÉ","ctaEvidence":"EVIDENCE DRAWER","ctaGithub":"VIEW MY GITHUB","ctaLinkedin":"FIND ME ON LINKEDIN","after":["Mere teen diye bhi ek-ek karke jale. Jahan jawab adhura tha, wahan maine adhura hi likha.","Sawaal poochhne ke liye yeh page khula hai. The best interface gets out of the way. The best evidence doesn't."],"sign":"Shubh Deepavali.","signLater":"Shukriya.","name":"— Shriniwas"},"deeper":{"step":"06 · Go deeper","sub":"Evidence receipts, longer stories, personal details, visitor lamp, the essay link · Self-paced","heading":"Go deeper","stories":"Longer stories","personal":"Personal details","essay":"Read my long-form essay","evidence":"Evidence receipts"},"wish":{"kicker":"YOUR TURN","heading":"Ab aapki baari","visitor":"Visitor lamp","intro":["Is baar soan papdi nahi, ek wish.","Mere teen diye ab roshan hain. Ab ek aur: aapka apna.","Ek real insaan sochiye. Do-teen line, jo sirf aap unse keh sakte hain. Generic forward nahi.","Bolkar likhiye, jaise unse baat kar rahe hon. Flow ya koi voice typing ho toh bol dijiye; nahi ho toh type bhi chalega.","Deepavali ho ya na ho: koi achhi khabar, koi purani yaad, ya bas “yaad aaye”. Sab chalega."],"english":"Write one short wish for one real person, in any language you like.","ideasLabel":"Kuch idea chahiye? Chuniye (optional):","ideas":["Kisi ko, jinse aap is baar mil nahi paayenge.","Kisi ko, jinhone aapko kabhi kuch sikhaya.","Kisi ko, jise aapne kabhi theek se thank you nahi kaha.","Kisi ko, jinse baat kiye bahut din ho gaye."],"forLabel":"Kiske liye? (pehla naam, optional)","wishLabel":"Aapki wish","wishPlaceholder":"Jaise unse baat kar rahe hon, waise likhiye…","fromLabel":"Aapka pehla naam (optional)","make":"Card banaiye","empty":"Ek line toh likhiye, phir card ban jaayega.","privacy":"Ek baat saaf: yeh page aapki wish upload ya save nahi karta; woh sirf aapke tab mein banti hai. Jab aap card bhejte hain (WhatsApp ya copy), tab wish aur naam wahin tak jaate hain jahan aap bhejte hain. Bolkar likhte hain toh aapka voice tool apne niyam se chalega.","privacyEn":"In short: this page doesn't upload or save your wish. If you send the card, it goes only where you send it.","cardTitle":"EK DIYA SE DOOSRA","cardFor":"{name} ke liye:","cardTail":"Ek diya doosre diye se. Yahan se jalaiye: {link}","cardEn":"One lamp lights another.","ready":"Card taiyar hai. Jisko bhejna ho, bhej dijiye.","litHeading":"Aapka diya jal utha.","whatsapp":"WhatsApp par bhejiye","copyText":"Card ka text copy kijiye","copyLink":"Link copy kijiye","change":"Badlein","copied":"Copy ho gaya.","copyFail":"Copy nahi ho paya. Link select karke copy kar lijiye.","under":"Yeh wish sirf is tab mein hai. Bhejna ho toh abhi bhej dijiye.","again":"Phir se shuru kijiye"},"sixty":{"label":"THE 60-SECOND FILE · Jaldi mein hain? Yeh padhiye.","headline":"324 tests passed. A separate audit found 19 problems. Would you have shipped it?","body":["I'm Shriniwas, an engineering student applying to Wispr Flow's India growth internship. I mapped workflows and architectures, made or approved key design decisions, and used AI agents for implementation and investigation.","In one project, I approved further corrections after the first audit fixes weren't enough. In another, a watchdog called a late reply proof of a healthy connection. I questioned whether the tests actually proved the product's promise; the corrected test failed when its fix was removed.","I also withdrew a flattering speed claim.","I have no growth wins to borrow. But I've used Flow, and I want to test whether a Hinglish-first demonstration helps Indian students reach their first useful dictation and return for another."],"line":"I can't promise I'll always be right. I can show you what I do when I'm wrong.","ctaReceipt":{"label":"OPEN ONE RECEIPT","folder":"c1"},"ctaInterview":"INVITE ME TO AN INTERVIEW"},"evidence":{"folders":[{"id":"c1","name":"CERTGEN — The green wall","purpose":"A college can generate certificates for thousands of students, accept the valid rows and explain the invalid rows without making everyone else start again.","finding":"324 passing release-candidate tests preceded a separate 19-finding forensic audit (two high). Among the issues were disproportionate CPU work on a crafted value and memory-intensive expansion from a roughly 26 MB request into roughly 192 MB of response material. The audit did not certify the prototype for unrestricted network exposure.","mine":"Requirements and architectural decisions were recorded. I approved bounded error-reporting, resource limits, later authentication-related changes and continuing remediation when findings remained. AI agents performed many of the technical investigations and fixes.","results":"The remediation report says zero open findings within the identified list. Later local checks passed 479 main-suite and 232 audit-suite tests (separate suites, not necessarily 711 independent tests). The optional QR-verification branch passed its own tests but failed a pre-agreed existing requirement and was not merged. A series of further remediation attempts was necessary, and no claim of security certification is justified.","inspect":{"label":"Bulk Certificate Generator","url":"https://github.com/Shri2909/Bulk-Certificate-Generator","files":["audit/AUDIT_REPORT.md","audit/REMEDIATION_REPORT.md","docs/BLUEPRINT_AMENDMENTS.md","tests/"],"note":"Some of these reports are local or ignored in the repository. For those, the evidence is available on request."},"status":[["PUBLIC","Repository"],["REPO-REPORTED","Test counts, audit and remediation results"],["EVIDENCE AVAILABLE ON REQUEST","Some report files are local or ignored in the repository"],["UNRESOLVED","Who commissioned the forensic audit"]],"more":["“The Feature I Killed”: a QR enhancement was rejected because it regressed required PDF behavior. This is a scope and quality judgment, not a statement about the feature's inherent worth.","Commit trailers credit autonomous AI work. I did not personally write every endpoint."],"blurb":"324 tests, phir 19 findings, aur mera hissa kitna tha."},{"id":"c3","name":"BLITZ — The number I withdrew","purpose":"A fast matching engine keeps track of buyers and sellers, but a claimed speed improvement matters only if it can be reliably reproduced.","finding":"The README's earlier 1,205 ns headline came from an uncommitted working tree. A more controlled historical run gave 1,850 ns. A reported memory-layout advantage shrank from 3.1× to about 1.02× and some verdicts became inconclusive.","mine":"The decision to retract or downgrade the claim is visible in commit f46a9cb and in historical README revisions. AI agents were involved in the benchmark overhaul and the audits.","results":"A later AI-executed audit found 3,059 crossed-at-rest states in 110,000 replay events (2.78%). Remediation reported zero such states on the replay, and fixing the matching engine made earlier latency numbers stale. New engine latency was not remeasured. An existing test had actually asserted the invalid state.","inspect":{"label":"Blitz","url":"https://github.com/Shri2909/Blitz-Limit-Order-Book","files":["commit f46a9cb","historical README","METHODOLOGY.md","results/98a597b/","branch-only audit/ reports"]},"status":[["PUBLIC","Repository"],["REPO-REPORTED","Retraction of the 1,205 ns headline"],["LOCAL-BRANCH","Audit reports"],["UNRESOLVED","Current latency has not been remeasured. The 1,850 ns run is historical."]],"more":["At last review, the public default branch did not include the stale-results warning.","An AF_XDP latency spike was traced to competing processes pinned to the same cores and touchpad interrupts; that subsystem has since been removed from uncommitted work.","A chart displayed passing tests despite missing executables and an unverified sanitizer claim.","An Avellaneda–Stoikov strategy lost to a naive benchmark on five tickers; the reason for reverting it is not documented."],"blurb":"1,205 se 1,850 tak ka poora hisaab, aur jo abhi remeasure nahi hua."},{"id":"c2","name":"VIGIL — The late witness","purpose":"A monitor checks whether a stream of important information is still alive. A late reply must not count as proof of current health.","finding":"The original handle_pong logic accepted stale or future-timestamped replies. The project plan records a question about whether its tests truly established the stated state-machine behavior. An agent investigated the code and implemented the correction with an approval gate.","mine":"I questioned whether the tests proved the system's real promise.","results":"A later local verification reported 105/105 tests passing. Replacing the guard with `if (false)` made exactly two targeted tests fail. A simulated three-feed lifecycle demonstrated failure, reconnection and recovery. There was no production exchange deployment, and the kernel-level network-loss script was not run.","inspect":{"label":"Vigil","url":"https://github.com/Shri2909/Vigil-Low-latency-TCP-heartbeat-monitor","files":["PROJECT_PLAN.md §§18–19","src/connection.cpp","test/connection_test.cpp","test/feed_monitor_test.cpp","demo/lifecycle_demo.cpp"]},"status":[["PUBLIC","Repository"],["REPO-REPORTED","105/105 tests, verified locally in an agent session (not CI)"],["UNRESOLVED","Who asked the correctness question and who approved the semantic change"]],"more":["A CLI dropped piped commands when EOF arrived with the final input; the pattern appeared at three sites.","A benchmark comparing reactor architectures inherited a one-CPU affinity mask, invalidating the original naive-baseline comparison. Committed documents still disagree on absolute CPU numbers.","An 18-gap specification exercise led to a first-class feed simulator and protocol decisions.","One deeper fuzzing harness hung in the sandbox and remains incompletely validated. None of this is production or CI evidence."],"blurb":"Ek late reply, ek sawaal, aur do tests jo correction hatane par fail hue."},{"id":"c6","name":"ROLES — Who designed, who executed, who verified?","mine":"As I describe it: sketching complete workflows and architectures; defining goals and constraints; making or approving major design, scope and user-flow decisions; identifying bottlenecks; directing deliberate attempts to break the prototypes; reading audit results and deciding which fixes or further tests to pursue. This is my firsthand account, which is different from actions specifically recorded in each repository's logs. The provenance of some prompts and audit initiations remains uncertain.","finding":"AI agents did the coding, many root-cause investigations, fuzzing, audits, tests, benchmarks and documentation. AI-generated code is not claimed as manually implemented or independently discovered. Individual tests and reports are called repository-reported unless freshly rerun as noted.","status":[["UNRESOLVED","Provenance of some prompts and audit initiations"]],"labels":{"finding":"The AI agents' role","mine":"My role, as I describe it"},"blurb":"Kisne kya kiya, seedhe shabdon mein."},{"id":"c7","name":"THE PERSON AND THE VOICE — Sources","purpose":"Where to read more, and what is and is not claimed about the voice receipt.","results":"The two takes on this page are from 2 November 2026, at 7:27 pm and 7:30 pm. The “As I said it” text is my own hand transcription of a separate voice memo; it is not an automatically produced transcript. No audio is published on this page. A recorded build in which Flow dictation drives a builder, followed by a spoken correction, has not been supplied, so that build receipt is pending. The original engineering repositories were not built with Flow.","links":[{"label":"Read my long-form essay","key":"essay"},{"label":"View my résumé","key":"resume"}],"status":[["PROPOSED","A voice-to-builder build receipt"]],"labels":{"results":"Provenance"},"blurb":"Voice takes kahan se aaye, aur kya abhi baaki hai."},{"id":"c8","name":"INDIA GROWTH TEST — The proposed protocol","purpose":"Can an actual message-first Hinglish demonstration help Indian students and early-career workers experience the value of Flow more effectively than a speed-focused pitch?","finding":"Audience: a small, reachable group of students and early-career users who naturally write Hindi-English messages. I would not assume that every Indian student uses Hinglish.\n\nVariant A, speed: “Say the message. Skip typing it.”\n\nVariant B, expression: “Don't stop the thought halfway through. Say it naturally.”","mine":"Design: the same real task and demo duration, rotated message order, success defined in advance, consent collected, no sensitive content. A small exploratory sample with counts per variant; no causal certainty claimed. Record what objection people raise and what they actually do.","results":"First useful action: the recipient creates a usable first dictation in a real app without needing a full rewrite. Return action: a second useful dictation within 24 hours, confirmed appropriately, not merely opening the app. Failure condition: no improvement on first success or second use, or results too small or noisy. Next iteration: revise the framing, user segment or first-message context based on the objections, and test again.","more":["A separate self-only experiment: five paired tasks, typed versus Flow, alternating order and recording time, edit count and whether the result was usable. That would give a personal workflow observation, not a claim about user behavior."],"status":[["PROPOSED","No activation result, conversion lift, sample count or cohort metric is claimed. Neither experiment has been run."]],"labels":{"finding":"Audience and variants","mine":"Design","results":"Actions, failure condition and next step","more":"A separate self-only experiment"},"blurb":"Poora protocol. Proposed, not run."}]},"footer":["Wispr Flow ke India growth internship challenge ke liye banaya hai. Prototypes, not products. Har number ka source aur status Evidence drawer mein hai.","AI agents wrote a substantial share of the code in these projects. I directed, approved and questioned. Kisne kya kiya, woh drawer mein hai, jitna main saabit kar sakta hoon.","Yeh page aapki wish upload ya save nahi karta.","Is page mein koi analytics, cookies ya third-party script nahi hai.","Only the two takes above were spoken with Wispr Flow.","This is an independent application page. Wispr Flow and Emergent have not reviewed or endorsed it.","© Shriniwas Kholkute"]}</script>
<script>
(function () {
'use strict';
/* ---- 00-util.js ---- */
/* Ek Diya Se Doosra: shared helpers. All files in src/js are concatenated in order by scripts/build.py. */
'use strict';
const EK = window.EK = window.EK || {};
const SVGNS = 'http://www.w3.org/2000/svg';

EK.reduced = false;
try { EK.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { EK.reduced = false; }

/* Tiny element builder. attrs: class, text, path (data-path for the review build), on* handlers, anything else is an attribute. */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  fill(el, attrs, kids);
  return el;
}
function s(tag, attrs, ...kids) {
  const el = document.createElementNS(SVGNS, tag);
  fill(el, attrs, kids);
  return el;
}
function fill(el, attrs, kids) {
  if (attrs) {
    for (const k of Object.keys(attrs)) {
      const v = attrs[k];
      if (v === false || v === null || v === undefined) continue;
      if (k === 'class') el.setAttribute('class', v);
      else if (k === 'text') el.textContent = v;
      else if (k === 'path') el.setAttribute('data-path', v);
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
  }
}
/* Append children, skipping null/false (native append() would print the word "null"). */
function put(el, ...kids) { fill(el, null, kids); return el; }
const has = (v) => typeof v === 'string' ? v.trim().length > 0 : Array.isArray(v) ? v.length > 0 : !!v;
const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const easeOut = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeInOut = (x) => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

/* Small inline icons (decorative: aria-hidden). */
EK.icon = function (name) {
  const a = { viewBox: '0 0 24 24', 'aria-hidden': 'true', focusable: 'false', fill: 'none', stroke: 'currentColor', 'stroke-width': '2', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
  const paths = {
    chevron: [s('path', { d: 'M6 9 L12 15 L18 9' })],
    down: [s('path', { d: 'M12 5 L12 19 M6 13 L12 19 L18 13' })],
    menu: [s('path', { d: 'M4 7 H20 M4 12 H20 M4 17 H20' })],
  };
  return s('svg', a, paths[name] || []);
};

/* Keep Tab inside a modal dialog (native dialogs already make the rest of the page inert; this stops focus escaping to browser chrome). */
EK.trapFocus = function (dlg) {
  dlg.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const f = [...dlg.querySelectorAll('button, a[href], input, [tabindex]:not([tabindex="-1"])')].filter((x) => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || !dlg.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement === last || !dlg.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
  });
};

/* Scroll to a sheet and keep aiming: the page height can change under a smooth scroll (a story opens), so check again once it settles and correct if the target drifted. */
EK.goTo = function (el, focus) {
  if (!el) return;
  if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '-1');
  const aim = () => el.scrollIntoView({ behavior: EK.reduced ? 'auto' : 'smooth', block: 'start' });
  aim();
  if (!EK.reduced) [900, 1900].forEach((ms) => setTimeout(() => { const top = el.getBoundingClientRect().top; if (Math.abs(top - parseFloat(getComputedStyle(el).scrollMarginTop || 0)) > 80) aim(); }, ms));
  if (focus !== false) el.focus({ preventScroll: true });
};

/* ---- 05-rich.js ---- */
/* Small text helpers: **bold**, *italic* and `code` inline markup, paragraphs, buttons and links that the sections share. */
EK.rich = function (text) {
  const out = [];
  String(text == null ? '' : text).split(/(\*\*[^*]+\*\*|\*[^*\s][^*]*\*|`[^`]+`)/).forEach((p) => {
    if (!p) return;
    if (p.startsWith('**') && p.endsWith('**') && p.length > 4) out.push(h('strong', { text: p.slice(2, -2) }));
    else if (p.startsWith('*') && p.endsWith('*') && p.length > 2) out.push(h('em', { text: p.slice(1, -1) }));
    else if (p.startsWith('*') && p.endsWith('*') && p.length > 2) out.push(h('em', { text: p.slice(1, -1) }));
    else if (p.startsWith('`') && p.endsWith('`') && p.length > 2) out.push(h('code', { text: p.slice(1, -1) }));
    else out.push(p);
  });
  return out;
};

/* Paragraphs from an array of strings. A paragraph that is one bold sentence becomes a pull line. */
EK.prose = function (arr, cls) {
  return h('div', { class: 'prose' + (cls ? ' ' + cls : '') }, (arr || []).filter(has).flatMap((t) => String(t).split(/\n\s*\n/)).map((t) =>
    h('p', { class: /^\*\*[^*]+\*\*$/.test(t.trim()) ? 'pull' : null }, t.split('\n').flatMap((ln, i) => (i ? [h('br'), ...EK.rich(ln)] : EK.rich(ln))))));
};

/* A section of the night page. */
EK.sheet = function (id, labelledby, ...kids) {
  return h('section', { class: 'panel', id, 'data-section': id, 'aria-labelledby': labelledby }, ...kids);
};

EK.heading = (id, text, cls) => h('h2', { class: 'panel-title' + (cls ? ' ' + cls : ''), id: id + '-h', text });
EK.kicker = (text) => has(text) ? h('p', { class: 'kicker', text }) : null;

/* External link that looks like a button. */
EK.ext = (label, url, cls) => has(label) && has(url) ? h('a', { class: cls || 'btn', href: url, target: '_blank', rel: 'noopener noreferrer', text: label }) : null;

/* The interview call to action goes to a real contact only. With no contact in the content, it renders nothing. */
EK.interview = function (label, cls) {
  const c = (EK.data && EK.data.site && EK.data.site.contact) || {};
  if (!has(label)) return null;
  if (has(c.email)) return h('a', { class: cls || 'btn primary', href: 'mailto:' + c.email, text: label });
  if (has(c.linkedin)) return EK.ext(label, c.linkedin, cls || 'btn primary');
  return null;
};

/* A button that opens a folder in the evidence drawer. */
EK.receiptBtn = (r, cls) => r && has(r.label) ? h('button', { class: cls || 'btn', type: 'button', text: r.label, onclick: () => EK.openEvidence(r.folder) }) : null;

EK.step = (x) => x && has(x.step) ? h('div', { class: 'step' }, h('p', { class: 'step-n', text: x.step }), has(x.sub) ? h('p', { class: 'step-sub', text: x.sub }) : null) : null;

/* Open a lamp's Level 2 (the complete story) and bring it into view. */
EK.openStory = function (id) {
  const det = document.getElementById(id + '-l2');
  if (!det) return;
  det.open = true;
  EK.goTo(det, false);
  const f = det.querySelector('summary');
  if (f) f.focus({ preventScroll: true });
};

/* Open a lamp's Level 2 (the complete story) and bring it into view. */
EK.openStory = function (id) {
  const det = document.getElementById(id + '-l2');
  if (!det) return;
  det.open = true;
  EK.goTo(det.closest('section') || det, false);
  const f = det.querySelector('summary');
  if (f) f.focus({ preventScroll: true });
};

/* The recruiter journey: a numbered step with a one-line description above a section heading. */
EK.step = (x) => x && has(x.step) ? h('div', { class: 'step' }, h('p', { class: 'step-n', text: x.step }), has(x.sub) ? h('p', { class: 'step-sub', text: x.sub }) : null) : null;

/* ---- 10-engine.js ---- */
/* The opening engine: computed, never hand-marked.
   normalize -> word-level LCS -> ONE merged token stream (MATCHED, RAW-ONLY, ADDED, BREAK). */
EK.engine = (function () {
  const norm = (w) => w.toLowerCase().replace(/[‘’]/g, "'").replace(/[^\p{L}\p{N}']/gu, '');

  function words(text) { return text.split(/\s+/).filter(Boolean); }

  /* Word-level longest common subsequence over normalized forms. Empty normalized forms never match. */
  function lcsPairs(a, b) {
    const n = a.length, m = b.length;
    const dp = Array.from({ length: n + 1 }, () => new Int16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        dp[i][j] = (a[i] && a[i] === b[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    const pairs = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a[i] && a[i] === b[j]) { pairs.push([i, j]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
      else j++;
    }
    return pairs;
  }

  /* Returns [{t:'m'|'ro'|'ad'|'br', raw, out}] in display order. */
  function buildStream(raw, output) {
    const paras = raw.split(/\n\s*\n/).map(words).filter((p) => p.length);
    const rawWords = [];
    paras.forEach((p, pi) => p.forEach((w, wi) => rawWords.push({ w, pi, last: wi === p.length - 1 && pi < paras.length - 1 })));
    const outWords = words(output);
    const pairs = lcsPairs(rawWords.map((r) => norm(r.w)), outWords.map(norm));

    const stream = [];
    const pushRaw = (r, type, out) => {
      stream.push({ t: type, raw: r.w, out: out });
      if (r.last) stream.push({ t: 'br', raw: '', out: '' });
    };
    let ri = 0, oi = 0;
    for (const [pi, pj] of pairs.concat([[rawWords.length, outWords.length]])) {
      while (ri < pi) { pushRaw(rawWords[ri], 'ro', ''); ri++; }
      while (oi < pj) { stream.push({ t: 'ad', raw: '', out: outWords[oi] }); oi++; }
      if (pi < rawWords.length) { pushRaw(rawWords[pi], 'm', outWords[pj]); ri = pi + 1; oi = pj + 1; }
    }
    return stream;
  }

  /* Pure text of the stream at frontier k: tokens with index < k are resolved. */
  function textAt(stream, k) {
    const parts = [];
    stream.forEach((t, i) => {
      const res = i < k;
      if (t.t === 'br') parts.push(res ? ' ' : '\n\n');
      else if (t.t === 'm') parts.push(res ? t.out : t.raw);
      else if (t.t === 'ro') { if (!res) parts.push(t.raw); }
      else if (res) parts.push(t.out);
    });
    return parts.join(' ').replace(/\s+/g, ' ').trim();
  }

  return { norm, words, lcsPairs, buildStream, textAt };
})();

/* The shell: section registry, the top bar, the lamp state (which lamps are lit) and the tone of the night.
   A section renders nothing when its content is empty. */
EK.order = ['opening', 'person', 'lamps', 'lamp1', 'lamp2', 'lamp3', 'transition', 'voice', 'growth', 'verdict', 'deeper', 'evidence', 'wish'];

/* Lamp state. Lamps light in order from the home flame. Nothing is stored anywhere: reload and the row starts again. */
EK.lamps = (function () {
  const lit = [false, false, false];
  let visitor = false;
  const subs = [];
  const count = () => lit.filter(Boolean).length;
  const api = {
    lit, count,
    isLit: (n) => !!lit[n - 1],
    visitor: () => visitor,
    onChange: (fn) => { subs.push(fn); },
    light(n) {
      if (n < 1 || n > lit.length || lit[n - 1]) return false;
      lit[n - 1] = true;
      api.notify(n);
      return true;
    },
    lightAll() { lit.forEach((_, i) => { if (!lit[i]) { lit[i] = true; } }); api.notify(0); },
    lightVisitor() { if (visitor) return; visitor = true; api.notify(-1); },
    notify(n) {
      const c = count();
      document.documentElement.setAttribute('data-tone', String(c));
      document.documentElement.classList.toggle('dusk', c === lit.length);
      document.documentElement.classList.toggle('visitor-lit', visitor);
      subs.forEach((fn) => { try { fn(n); } catch (e) { /* decorative */ } });
    },
  };
  return api;
})();

  verdict.id = 'late-verdict'; arrival.id = 'late-arrival';

  const bNew = h('button', { type: 'button', class: 'btn', 'aria-pressed': 'false', text: ui.logicNew || '', onclick: () => setMode('new') });

    else if (mode === 'old') { state = 'bad'; b = 'COUNTED'; txt = 'Counted as proof the connection is healthy, even though it arrived late.' + (m.oldLate ? ' ' + m.oldLate : ''); }
    else { state = 'good'; b = 'NOT COUNTED'; txt = 'Not counted as proof of current health, because it arrived after the deadline.'; }
    verdict.setAttribute('data-state', state);

  update();
  return root;

/* ---- 50-voice.js ---- */
/* Why Wispr Flow: the voice. Interaction 3 compares my hand transcription with Flow's real text, word by word (the engine computes every mark). */
function compareWidget(x, ui) {
  const takes = (x.takes || []).filter((t) => has(t.raw) && has(t.output));
  if (!takes.length) return null;
  let ti = 0, stream = [], N = 0, k = 0;

  const text = h('div', { class: 'cmp-text', 'aria-hidden': 'true' });
  const range = h('input', { type: 'range', class: 'string', id: 'cmp-r', min: 0, max: 1, step: 1, value: 0, 'aria-label': (ui.hint || '') + ' ' + (ui.hintKeys || ''), oninput: () => { k = parseInt(range.value, 10); render(); } });
  const plainBox = h('div', { class: 'plain-box' });
  const takeBtns = takes.map((t, i) => h('button', { type: 'button', class: 'btn', 'aria-pressed': i === 0 ? 'true' : 'false', text: t.label || ui['take' + (i + 1)] || '', onclick: () => setTake(i) }));

  function render() {
    const parts = [];
    stream.forEach((t, i) => {
      const res = i < k;
      if (t.t === 'br') { if (!res) parts.push(h('span', { class: 'pb' })); return; }
      let cls, word;
      if (t.t === 'm') { cls = res ? 'w flow' : 'w raw'; word = res ? t.out : t.raw; }
      else if (t.t === 'ro') { cls = res ? 'w raw cut' : 'w raw'; word = t.raw; }
      else { if (!res) return; cls = 'w flow add'; word = t.out; }
      parts.push(h('span', { class: cls, text: word }), ' ');
    });
    text.textContent = '';
    put(text, parts);
    range.value = k;
    range.style.setProperty('--f', (N ? k / N : 0).toFixed(3));
    range.setAttribute('aria-valuetext', k === 0 ? (ui.raw || '') : k >= N ? (ui.flow || '') : Math.round(100 * k / N) + '% of the way from my words to Flow’s words');
  }
  /* Reserve the height of the taller end state so nothing below moves while the string is dragged. */
  function reserve() {
    if (!text.offsetParent) return;
    const keep = k;
    text.style.minHeight = '';
    let tallest = 0;
    [0, N].forEach((v) => { k = v; render(); tallest = Math.max(tallest, text.offsetHeight); });
    k = keep; render();
    text.style.minHeight = tallest + 'px';
  }
  const recorded = () => [takes[ti].label, takes[ti].recordedAt].filter(has).join(' \u00b7 ');
  function setTake(i) {
    ti = i; k = 0;
    const t = takes[i];
    stream = EK.engine.buildStream(t.raw, t.output);
    N = stream.length;
    range.max = N;
    takeBtns.forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
    plainBox.textContent = '';
    put(plainBox,
      h('p', { class: 'lbl', text: ui.raw }), h('p', { class: 'rawp' }, t.raw.split(/\n\s*\n/).map((p) => [p, h('br')])),
      h('p', { class: 'lbl', text: ui.flow }), h('p', { class: 'outp', text: t.output }));
    const rec = root.querySelector('.rec');
    if (rec) rec.textContent = recorded();
    render();
    reserve();
  }

  const c = x.custody || {};
  const rows = [['Source', c.source], ['Tool', c.tool], ['Date', c.date], ['Recorded', null], ['Status', c.status], ['Note', c.note]];
  const custody = h('details', { class: 'chipd' },
    h('summary', { class: 'chip' }, h('span', { text: ui.chip || ui.custody || '' })),
    h('div', { class: 'custody' }, h('p', { class: 'cs-h', text: ui.custody }),
      h('dl', null, rows.map(([k2, v]) => {
        const val = k2 === 'Recorded' ? recorded() : v;
        return has(val) ? [h('dt', { text: k2 }), h('dd', { class: k2 === 'Recorded' ? 'rec' : null, text: val })] : null;
      }))));
  const root = h('div', { class: 'widget compare', role: 'group', 'aria-labelledby': 'cmp-l' },
    h('p', { class: 'label-brass', id: 'cmp-l', text: x.compareLabel }),
    takes.length > 1 ? h('div', { class: 'seg', role: 'group', 'aria-label': ui.takes || '' }, takeBtns) : null,
    h('div', { class: 'cmp-ends', 'aria-hidden': 'true' }, h('span', { text: ui.raw }), h('span', { text: ui.flow })),
    text, range,
    has(ui.hint) ? h('p', { class: 'hint', text: ui.hint + ' ' + (ui.hintKeys || '') }) : null,
    has(ui.legend) ? h('p', { class: 'legend', text: ui.legend }) : null,
    custody,
    h('details', { class: 'readplain' }, h('summary', { class: 'linkbtn', text: ui.readBoth || '' }), plainBox));
  setTake(0);
  EK.onReady.push(reserve);
  let rz = 0;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(reserve, 120); });
  return root;
}

/* ---- 65-wish.js ---- */
/* Your turn: one short wish for one real person. Made in this tab only: nothing is uploaded, saved or stored. Making the card lights the visitor's lamp. */
EK.defineSection('wish', (d) => {
  const x = d.wish;
  if (!x) return null;
  const forIn = h('input', { type: 'text', id: 'wish-for', maxlength: 40, autocomplete: 'off' });
  const wishIn = h('textarea', { id: 'wish-text', rows: 4, maxlength: 400, placeholder: x.wishPlaceholder || '' });
  const fromIn = h('input', { type: 'text', id: 'wish-from', maxlength: 40, autocomplete: 'given-name' });
  const msg = h('p', { class: 'wish-msg', role: 'status', 'aria-live': 'polite' });
  const out = h('div', { class: 'wish-out', hidden: true });
  const visitor = h('div', { class: 'visitor', 'aria-hidden': 'true' }, EK.diya('v'));
  const clean = (t) => String(t || '').replace(/\s+/g, ' ').trim();
  const pageLink = () => location.href.split('#')[0];

  function cardText() {
    const to = clean(forIn.value), me = clean(fromIn.value), wish = String(wishIn.value || '').trim();
    const lines = [x.cardTitle, ''];
    if (to) lines.push((x.cardFor || '').replace('{name}', to), '');
    lines.push('"' + wish + '"', '');
    if (me) lines.push('— ' + me, '');
    lines.push((x.cardTail || '').replace('{link}', pageLink()), '', x.cardEn);
    return lines.join('\n');
  }
  function copy(text) {
    const done = () => { msg.textContent = x.copied; };
    const fail = () => { msg.textContent = x.copyFail; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
    else {
      const ta = h('textarea', { 'aria-hidden': 'true', style: 'position:fixed;opacity:0' }); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? done() : fail(); } catch (e) { fail(); }
      ta.remove();
    }
  }
  function make(e) {
    e.preventDefault();
    if (!clean(wishIn.value)) { msg.textContent = x.empty; wishIn.focus(); return; }
    const to = clean(forIn.value), me = clean(fromIn.value), wish = clean(wishIn.value);
    const text = cardText();
    out.textContent = '';
    put(out,
      h('h3', { class: 'mini big lit-head', text: x.litHeading }),
      h('blockquote', { class: 'wish-card' },
        h('p', { class: 'wc-title', text: x.cardTitle }),
        to ? h('p', { text: (x.cardFor || '').replace('{name}', to) }) : null,
        h('p', { class: 'wc-wish', text: '“' + wish + '”' }),
        me ? h('p', { class: 'wc-from', text: '— ' + me }) : null,
        h('p', { class: 'wc-tail', text: (x.cardTail || '').replace('{link}', pageLink()) }),
        h('p', { class: 'wc-en', text: x.cardEn })),
      h('p', { class: 'wish-ready', text: x.ready }),
      h('div', { class: 'cta-row' },
        h('a', { class: 'btn primary', href: 'https://wa.me/?text=' + encodeURIComponent(text), target: '_blank', rel: 'noopener noreferrer', text: x.whatsapp }),
        h('button', { class: 'btn', type: 'button', text: x.copyText, onclick: () => copy(text) }),
        h('button', { class: 'btn', type: 'button', text: x.copyLink, onclick: () => copy(pageLink()) }),
        h('button', { class: 'btn', type: 'button', text: x.change, onclick: () => { out.hidden = true; form.hidden = false; wishIn.focus(); } })),
      h('p', { class: 'note-line', text: x.under }));
    out.hidden = false; form.hidden = true; msg.textContent = '';
    EK.lamps.lightVisitor();
    out.querySelector('h3').setAttribute('tabindex', '-1'); out.querySelector('h3').focus({ preventScroll: false });
  }

  const ideas = (x.ideas || []).filter(has).map((t) => h('button', { type: 'button', class: 'idea', text: t, onclick: () => { forIn.focus(); msg.textContent = t; } }));
  const form = h('form', { class: 'wish-form', onsubmit: make, novalidate: true },
    ideas.length ? h('div', { class: 'ideas', role: 'group', 'aria-label': x.ideasLabel }, h('p', { class: 'lbl', text: x.ideasLabel }), ideas) : null,
    h('label', { class: 'lbl', for: 'wish-for', text: x.forLabel }), forIn,
    h('label', { class: 'lbl', for: 'wish-text', text: x.wishLabel }), wishIn,
    h('label', { class: 'lbl', for: 'wish-from', text: x.fromLabel }), fromIn,
    h('div', { class: 'cta-row' }, h('button', { type: 'submit', class: 'btn primary', text: x.make })),
    msg);
  return EK.sheet('wish', 'wish-h', EK.kicker(x.kicker), EK.heading('wish', x.heading),
    h('div', { class: 'wish-top' }, h('div', { class: 'wish-intro' }, EK.prose(x.intro), h('p', { class: 'en-line', text: x.english })), visitor),
    form, out,
    h('p', { class: 'privacy' }, x.privacy, h('br'), h('em', { text: x.privacyEn })));
});

          EK.interview(x.ctaInterview, 'btn'),
          h('button', { class: 'btn', type: 'button', text: ui.close || 'Close', onclick: () => dlg.close() }))));
